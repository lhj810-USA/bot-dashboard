<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#02070d"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="config.js"></script>
<title>혁진님의 JARVIS</title><style>
:root{--c:#00f0ff;--c2:#1d7bff;--dim:#5f8ea3;--bg:#02070d}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#06202e 0,#02070d 60%) fixed;color:#d8f6ff;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;font-size:12px;padding-bottom:96px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,240,255,.03) 0 1px,transparent 1px 3px)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;padding-top:max(10px,env(safe-area-inset-top))}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:3px;color:var(--c);text-shadow:0 0 10px var(--c)}.sub{color:var(--dim);font-size:10px;letter-spacing:1px}
.btns{display:flex;gap:5px}button{background:rgba(0,240,255,.08);color:var(--c);border:1px solid rgba(0,240,255,.45);border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;white-space:nowrap;box-shadow:0 0 8px rgba(0,240,255,.15) inset}
button:active{background:rgba(0,240,255,.25)}
.hud{display:grid;grid-template-columns:1fr;gap:10px;padding:4px 10px;max-width:1240px;margin:0 auto}
.core{display:flex;align-items:center;gap:10px;justify-content:center}
.ring{position:relative;width:170px;height:170px;flex:none}.ring svg{position:absolute;inset:0;filter:drop-shadow(0 0 6px var(--c))}
.spin{animation:sp 18s linear infinite;transform-origin:50% 50%}.spin2{animation:sp 30s linear infinite reverse;transform-origin:50% 50%}@keyframes sp{to{transform:rotate(360deg)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc b{font-size:22px;color:var(--c);text-shadow:0 0 12px var(--c)}.rc span{font-size:9px;color:var(--dim);letter-spacing:1px}
.metrics{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;max-width:220px}
.m{border-left:2px solid var(--c);padding:3px 7px;background:linear-gradient(90deg,rgba(0,240,255,.09),transparent)}
.m .k{font-size:9px;color:var(--dim);letter-spacing:1px}.m .v{font-size:12px;color:#fff}.m .n{font-size:9px;color:#ffb44d}
.depts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dept{border:1px solid rgba(0,240,255,.25);border-radius:8px;padding:5px;background:rgba(4,22,34,.6);box-shadow:0 0 12px rgba(29,123,255,.12)}
.col{display:contents}.dept h2{margin:0 0 4px;font-size:10px;letter-spacing:2px;color:var(--c)}.dept.wide{grid-column:1/-1}
.bot{padding:4px 5px;border-top:1px solid rgba(0,240,255,.1);cursor:pointer}.bot:first-of-type{border-top:0}
.bot .t{display:flex;justify-content:space-between;align-items:center;gap:4px}.bot .nm{font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:currentColor;vertical-align:middle}.dot.unknown{background:#3d5563}.dot.idle{background:#4dffa6}.dot.running{background:#4d9bff}.bot .ds{color:#9cc3d3;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bot .la{color:var(--dim);font-size:9px}
.b{font-size:8.5px;padding:1px 6px;border-radius:9px;border:1px solid;flex:none}.idle{color:#4dffa6;border-color:#4dffa6;box-shadow:0 0 6px #4dffa6}.running{color:#4d9bff;border-color:#4d9bff;box-shadow:0 0 6px #2f7bff}.unknown{color:#7f97a3;border-color:#3d5563}
.cmd{position:fixed;left:8px;right:8px;bottom:8px;border-radius:16px;border:1px solid rgba(0,240,255,.55)!important;padding:8px 10px;margin-bottom:env(safe-area-inset-bottom);padding-bottom:max(7px,env(safe-area-inset-bottom));background:rgba(2,10,18,.95);border-top:1px solid rgba(0,240,255,.4);box-shadow:0 -4px 20px rgba(0,240,255,.15)}
.cmd .row{display:flex;gap:6px;max-width:1240px;margin:0 auto}select,textarea{background:#031520;color:#d8f6ff;border:1px solid rgba(0,240,255,.4);border-radius:6px;font-size:12px;padding:6px}
select{max-width:38%}textarea{flex:1;height:34px;resize:none;border-radius:10px}.msg{font-size:10px;color:var(--c);max-width:1240px;margin:3px auto 0;min-height:12px}
@media(min-width:900px){body{font-size:13px}.hud{grid-template-columns:1fr 1.1fr 1fr;align-items:center;padding-top:16px}.core{flex-direction:column}.ring{width:300px;height:300px}.rc b{font-size:36px}.metrics{max-width:300px;width:100%}
 .depts{display:contents}.col{display:flex!important;flex-direction:column;gap:10px}.bot .nm{font-size:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:currentColor;vertical-align:middle}.dot.unknown{background:#3d5563}.dot.idle{background:#4dffa6}.dot.running{background:#4d9bff}.bot .ds{font-size:11px;white-space:normal}.dept{padding:9px}.dept h2{font-size:12px}}
</style></head><body>
<header><div><h1>혁진님의 JARVIS</h1><div class="sub">마지막 갱신 <span id="gen">-</span> · <span id="mode">-</span></div></div>
<div class="btns"><button id="refresh">새로고침</button><button id="pushOn">알림 허용</button><button id="pushTest">테스트</button></div></header>
<main class="hud" id="hud"></main>
<div class="cmd"><div class="row"><select id="sel"></select><textarea id="txt" placeholder="명령 입력…"></textarea><button id="send">전송</button></div><div class="msg" id="msg"></div></div>
<script>
const FALLBACK={

  },
  {

   "lastTurnAt": null,

  },
  {

   "lastTurnAt": null,

  },
  {

   "summary": "사용자와 매니저·트레이딩 감시자 봇 사이의 대표 봇: 질문 전달, 결과 정리 보고, 봇 간 조율"
  },
  {

  },
  {
   "id": "ec952ea5-d6ba-48db-8957-34895ac75c50",
   "name": "자동 매매_실험",
   "description": "다른 Bot을 관리하고, 결정할 일이 있으면 불러요 사용자는 매일 Google, Microsoft 365, Zoom, GitHub, Jira, Canva, HubSpot, Figma을(를) 사용해요 — 커넥터를 제안하거나 일을 맡을 때 그 도구부터 시작하세요.",
   "lastTurnAt": null,
   "lastActivity": "알 수 없음",
   "localFileModified": "2026-10-11 10:05 CT",
   "status": "unknown",
   "dept": "자본",
   "summary": "다른 Bot을 관리하고, 결정할 일이 있으면 불러요 사용자는 매일 Google, Microsoft 365, Zoom, Gi…"
  },
  {
   "id": "c8f69e15-9014-4347-b118-d63b3ec13b29",
   "name": "이혁진 집사",
   "description": "알 수 없음",
   "lastTurnAt": null,
   "lastActivity": "알 수 없음",
   "localFileModified": "2026-10-11 10:05 CT",
   "status": "unknown",
   "dept": "자본",
   "summary": "알 수 없음"
  }
 ],
 "automations": [
  {
   "name": "자동화 트레이닝",
   "taskId": "ea82d2ea-ee33-499f-b00b-c59055a09071",
   "status": "비활성/아카이브"
  }
 ]
};
const B=(location.hostname==="localhost")?"":(window.API_BASE||"").replace(/\/$/,"");const AU=p=>(B?B+"/":"")+p;let api=false;
const esc=s=>String(s??"알 수 없음").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={idle:["idle","대기"],busy:["running","작업 중"],running:["running","작업 중"]};
function card(b){const s=ST[b.status]||["unknown","알 수 없음"];return `<div class="bot" onclick="pick('${b.id}')"><div class="t"><span class="nm"><i class="dot ${s[0]}"></i>${esc(b.name)}</span><span class="b ${s[0]}">${s[1]}</span></div><div class="ds">${esc(b.summary)}</div><div class="la">최근 활동: ${esc(b.lastActivity)}</div></div>`}
function dept(n,bs,w){return `<section class="dept ${w||""}"><h2>◢ ${n}</h2>${bs.map(card).join("")}</section>`}
function render(d){const by=k=>d.bots.filter(b=>b.dept===k),h=d.health||{known:0,total:d.bots.length},m=d.metrics||{};
 const pct=h.known? Math.round(100*d.bots.filter(b=>b.status==="idle"||b.status==="busy"||b.status==="running").length/h.total):null;
 const C=2*Math.PI*80,frac=h.total?h.known/h.total:0;
 const alerts=[];if(!h.known)alerts.push("봇 상태 데이터 없음 ("+h.total+"개 전부)");if(!d.bots.some(b=>b.lastTurnAt))alerts.push("최근 활동 기록 없음");if(!api)alerts.push("API 서버 미연결 (복사 모드)");
 const ring=`<div class="core"><div class="ring"><svg viewBox="0 0 200 200"><g class="spin2"><circle cx="100" cy="100" r="94" fill="none" stroke="#1d7bff" stroke-width="1" stroke-dasharray="2 6" opacity=".7"/></g>
 <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,240,255,.15)" stroke-width="10"/><circle cx="100" cy="100" r="80" fill="none" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}" transform="rotate(-90 100 100)"/>
 <g class="spin"><circle cx="100" cy="100" r="66" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="40 14 6 14" opacity=".8"/></g><circle cx="100" cy="100" r="56" fill="rgba(0,240,255,.05)" stroke="rgba(0,240,255,.3)"/></svg>
 <div class="rc"><span>SYSTEM HEALTH</span><b>${pct===null?"알 수 없음":pct+"%"}</b><span>상태 파악 ${h.known}/${h.total} 봇</span></div></div>
 <div class="metrics"><div class="m"><div class="k">잔고 BALANCE</div><div class="v">${m.balance??"연결 필요"}</div><div class="n">${esc(m.balanceNote)}</div></div>
 <div class="m"><div class="k">매매 상태 TRADING</div><div class="v">${m.pnl??"데이터 없음"}</div><div class="n">${esc(m.pnlNote)}</div></div>
 <div class="m"><div class="k">알림 ALERTS · ${alerts.length}건</div><div class="v" style="font-size:10.5px">${alerts.length?alerts.map(esc).join("<br>"):"없음"}</div></div></div></div>`;
 document.getElementById("hud").innerHTML=`<div class="depts"><div class="col">${dept("CORE · 총괄",by("core"),"wide")}${dept("자본",by("자본"),"wide")}</div>${ring}<div class="col">${dept("지식",by("지식"))}${dept("아르바이트",by("아르바이트"))}${dept("알림",by("알림"),"wide")}</div></div>`;
 const hud=document.getElementById("hud");if(innerWidth<900){const r=hud.querySelector(".core");hud.prepend(r)}
 document.getElementById("sel").innerHTML=d.bots.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");document.getElementById("gen").textContent=d.generatedAt}
async function load(){try{const r=await fetch(AU("api/health"));api=r.ok}catch(e){api=false}document.getElementById("mode").textContent=api?"라이브 서버":"정적 모드";
 let d;try{d=await (await fetch((api&&B?AU("data.json"):"data.json")+"?t="+Date.now())).json()}catch(e){d=FALLBACK}if(d)render(d)}
function pick(id){document.getElementById("sel").value=id;document.getElementById("txt").focus()}
const M=document.getElementById("msg");
document.getElementById("send").onclick=async()=>{const sel=document.getElementById("sel"),id=sel.value,name=sel.options[sel.selectedIndex].text,t=document.getElementById("txt").value.trim();if(!t){M.textContent="명령을 입력하세요";return}
 if(api){try{const r=await fetch(AU("api/command"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({botId:id,botName:name,prompt:t})});const j=await r.json();if(r.ok){M.textContent="대기열에 저장됨 (#"+j.id.slice(0,8)+") — 봇에 자동 전달되지 않음";document.getElementById("txt").value="";return}}catch(e){}}
 const x=`[${name}] ${t}`;try{await navigator.clipboard.writeText(x);M.textContent="클립보드에 복사됨 — Grok Bot 앱에서 "+name+"에게 붙여넣어 보내세요"}catch(e){M.textContent="복사 실패: "+x}};
document.getElementById("refresh").onclick=load;load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
document.getElementById("pushOn").onclick=async()=>{try{if(!("PushManager" in window)){M.textContent="푸시 미지원 (iPhone은 홈 화면 앱에서 열어야 함)";return}
 if(await Notification.requestPermission()!=="granted"){M.textContent="알림 권한 거부됨";return}
 const k=await (await fetch(AU("api/vapid"))).json();const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publicKey)});
 const r=await fetch(AU("api/subscribe"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});M.textContent=r.ok?"알림 구독 완료":"구독 저장 실패"}catch(e){M.textContent="알림 오류: 서버 미연결"}};
document.getElementById("pushTest").onclick=async()=>{try{const j=await (await fetch(AU("api/test-push"),{method:"POST"})).json();M.textContent="테스트 발송: 성공 "+j.sent+" / 실패 "+j.failed}catch(e){M.textContent="서버 연결 실패"}};
</script></body></html>
