</style></head><body><div id="bg"></div><svg id="hud"></svg>
<header><div class="hd"><div><h1>혁진님의 JARVIS</h1><div class="ts" id="ts">—</div></div><div class="ic"><button id="speak" title="브리핑 듣기">▶</button><button id="conn" title="연결">◎</button><button id="refresh" title="새로고침">⟳</button><button id="pushOn" title="알림 허용">◉</button><button id="lockBtn" title="잠금">⏻</button></div></div><div id="brief"></div></header>

<form class="bar" id="bar"><select id="sel"></select><input id="txt" placeholder="명령" autocomplete="off"><button type="button" id="mic" title="음성 명령">🎤</button><button>➤</button></form>
<div id="ov"><div class="pn" id="pn"></div></div>
<div id="lock"><div class="rg">J.A.R.V.I.S</div><form id="lf" style="display:flex;flex-direction:column;align-items:center;gap:12px"><input id="pw" type="password" placeholder="접근 코드" autocomplete="current-password"><label><input type="checkbox" id="rem"> 이 기기 기억</label><button>접속</button><div class="er" id="er"></div></form></div>
<script>
const B=location.hostname==="localhost"?"":(window.API_BASE||"").replace(/\/$/,"");const AU=p=>(B?B+"/":"")+p;let api=false,D=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"—").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=m=>{$("toast").textContent=m;clearTimeout(T.t);T.t=setTimeout(()=>$("toast").textContent="",5000)};
const COL={idle:"#3dff9a",working:"#2f8bff",busy:"#2f8bff",error:"#ff3b5c",unknown:"#4a5a63"},col=s=>COL[s]||COL.unknown,LB={idle:"정상",working:"작업 중",error:"오류",unknown:"—"};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const P=await (await fetch("payload.enc.json?t="+Date.now(),{cache:"no-store"})).json();
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.ct))))}
async function unlock(pw,remember){try{D=await decrypt(pw);if(remember)localStorage.setItem("jv_pw",pw);sessionStorage.setItem("jv_pw",pw);$("lock").style.display="none";render();return true}catch(e){$("er").textContent=e.name==="OperationError"?"접근 코드가 올바르지 않습니다":"데이터를 불러오지 못했습니다";return false}}
$("lf").onsubmit=e=>{e.preventDefault();$("er").textContent="해독 중…";unlock($("pw").value.trim(),$("rem").checked)};
$("lockBtn").onclick=()=>{localStorage.removeItem("jv_pw");sessionStorage.removeItem("jv_pw");D=null;$("hud").innerHTML="";$("brief").innerHTML="";$("lock").style.display="flex"};
function render(){if(!D)return;
 $("ts").textContent="SYNC "+D.generatedAt+(D.collectedAt?" · 연결 데이터 "+D.collectedAt.slice(5,16).replace("T"," ")+" CT":"")+(api?" · LIVE":"");
 $("brief").innerHTML=D.brief.map((l,i)=>`<div><b>${["◆ 봇","◆ 금융","◆ 현황"][i]||"◆"}</b> ${esc(l)}</div>`).join("");
 $("sel").innerHTML=D.bots.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");draw()}
function draw(){if(!D)return;const W=innerWidth,H=innerHeight,top=$("brief").getBoundingClientRect().bottom+8,bot=H-70,avail=bot-top;
 const R=Math.min(W*0.47,avail*0.5,330),cx=W/2,cy=top+avail/2;const r0=R*0.42,r1=R*0.58,r2=R;
 const p=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
 const wedge=(a0,a1,ri,ro)=>{const[x0,y0]=p(ro,a0),[x1,y1]=p(ro,a1),[x2,y2]=p(ri,a1),[x3,y3]=p(ri,a0);return `M${x0} ${y0}A${ro} ${ro} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 0 0 ${x3} ${y3}Z`};
 const arc=(r,a0,a1)=>{const[x0,y0]=p(r,a0),[x1,y1]=p(r,a1);return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
 const g=(c,b)=>`<g style="transform-origin:${cx}px ${cy}px" class="${c}">${b}</g>`;
 let s=`<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="scan"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity=".9"/></linearGradient></defs>`;
 let ticks="";for(let i=0;i<144;i++){const a=i*2.5,l=i%6?3:8,[x0,y0]=p(r2+4,a),[x1,y1]=p(r2+4+l,a);ticks+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="rgba(0,240,255,${i%6?.3:.8})"/>`}
 s+=g("r1",ticks)+g("r3",`<path d="${arc(r2+18,-90,-30)}" stroke="url(#scan)" stroke-width="2.5" fill="none"/>`);
 const N=D.sectors.length,seg=360/N;
 D.sectors.forEach((S,i)=>{const a0=-90-seg/2+i*seg+1.2,a1=a0+seg-2.4,am=(a0+a1)/2,c=col(S.status),bs=D.bots.filter(b=>b.dept===S.key);
  const [nx,ny]=p((r1+r2)/2+R*0.03,am),[dx,dy]=p(r1+R*0.075,am);
  let dots="";bs.forEach((b,j)=>{const aa=am+(j-(bs.length-1)/2)*Math.min(7,seg/(bs.length+1)),[x,y]=p(r1+R*0.07,aa);dots+=`<circle cx="${x}" cy="${y}" r="${Math.max(2.6,R*0.017)}" fill="${col(b.status)}" ${b.status==="working"?'class="pulse"':""} filter="url(#g)"/>`});
  const fs=Math.max(15,R*0.13)*(String(S.big).length>4?0.78:1);
  s+=`<g class="sec" onclick="openSec(${i})"><path d="${wedge(a0,a1,r1,r2)}" fill="${c}" fill-opacity=".07" stroke="rgba(0,240,255,.35)" stroke-width="1"/>
  <path class="w" d="${arc(r2-1.5,a0+.5,a1-.5)}" stroke="${c}" stroke-width="3" fill="none" opacity=".75" filter="url(#g)"/>
  <text x="${nx}" y="${ny-fs*0.55}" text-anchor="middle" style="font-size:${Math.max(9,R*0.05)}px;letter-spacing:2px;font-weight:600" fill="#00f0ff">${S.key}</text>
  <text x="${nx}" y="${ny+fs*0.5}" text-anchor="middle" font-size="${fs}" font-weight="250" fill="#fff" filter="url(#g)">${esc(S.big??"—")}</text>${dots}</g>`});
 // core
 const h=D.health||{},pct=h.pct,C=2*Math.PI*r0*0.92,fr=h.total?(h.ok||0)/h.total:0;
 s+=g("r2",`<circle cx="${cx}" cy="${cy}" r="${r1-5}" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="${R*0.3} ${R*0.08} 3 ${R*0.08}" opacity=".7"/>`);
 s+=`<g class="sec" onclick="openCore()"><circle cx="${cx}" cy="${cy}" r="${r0}" fill="rgba(0,14,18,.85)" stroke="rgba(0,240,255,.35)"/>
 <circle cx="${cx}" cy="${cy}" r="${r0*0.92}" fill="none" stroke="rgba(0,240,255,.12)" stroke-width="${R*0.025}"/>
 <circle cx="${cx}" cy="${cy}" r="${r0*0.92}" fill="none" stroke="${pct===100?"#3dff9a":"#00f0ff"}" stroke-width="${R*0.025}" stroke-dasharray="${C*fr} ${C}" transform="rotate(-90 ${cx} ${cy})" filter="url(#g)"/>
 <text x="${cx}" y="${cy-r0*0.38}" text-anchor="middle" class="t" style="font-size:${Math.max(7,R*0.035)}px">SYSTEM</text>
 <text x="${cx}" y="${cy+r0*0.2}" text-anchor="middle" font-size="${r0*0.55}" font-weight="200" fill="#fff" filter="url(#g2)">${pct==null?"—":pct+"<tspan font-size='"+r0*0.22+"'>%</tspan>"}</text>
 <text x="${cx}" y="${cy+r0*0.48}" text-anchor="middle" class="t" style="font-size:${Math.max(7,R*0.033)}px">CORE · ${h.ok??0}/${h.total??0} 봇</text>
 <circle cx="${cx}" cy="${cy+r0*0.68}" r="3" fill="${col((D.bots.find(b=>b.dept==="core")||{}).status)}" class="pulse"/></g>`;
 $("hud").innerHTML=s}
function botRows(bs,sel){return bs.map(b=>{const st=b.stages||null,cur=b.stage;let stg="";if(st&&st.length){const ci=st.indexOf(cur);stg=`<div class="stg">${st.map((x,j)=>`<em class="${j===ci?"on":ci>=0&&j<ci?"done":""}">${esc(x)}</em>`).join("")}</div>`}else if(cur)stg=`<div class="stg"><em class="on">${esc(cur)}</em></div>`;
 return `<div class="bt ${b.id===sel?"sel":""}" data-id="${b.id}"><div class="n"><i style="background:${col(b.status)};box-shadow:0 0 6px ${col(b.status)}"></i>${esc(b.name)} <small style="color:${col(b.status)};font-size:9px">${LB[b.status]||"—"}</small><span>${b.lastTurnAt?esc(b.lastActivity.slice(5)):"—"}</span></div>${b.summaryLive?`<div class="s">${esc(b.summary)}</div>`:""}${stg}</div>`}).join("")}
function panel(title,big,unit,lines,bs){let sel=bs.length?bs[0].id:null;const r=()=>{$("pn").innerHTML=`<h2><span>${esc(title)}</span><span style="cursor:pointer" onclick="closeOv()">✕</span></h2>${big!=null?`<div class="big">${esc(big)}</div><div class="u">${esc(unit)}</div>`:""}
 ${lines.filter(Boolean).map(l=>`<div class="ln">${esc(l)}</div>`).join("")}${bs.length?`<h3>담당 봇</h3>${botRows(bs,sel)}<form class="cm" id="cmf"><input id="otx" placeholder="명령" autocomplete="off"><button>➤</button></form>`:`<h3>담당 봇 없음</h3>`}`;
 $("pn").querySelectorAll(".bt").forEach(e=>e.onclick=()=>{sel=e.dataset.id;r()});if($("cmf"))$("cmf").onsubmit=async e=>{e.preventDefault();if(await send(sel,$("otx").value))closeOv()}};r();$("ov").classList.add("on")}
function openSec(i){const S=D.sectors[i];panel(S.key,S.big,S.unit,S.lines||[],D.bots.filter(b=>b.dept===S.key))}
function openCore(){const h=D.health;panel("CORE",h.pct==null?"—":h.pct+"%","시스템 정상 비율 ("+h.ok+"/"+h.total+" 봇, 오류 제외)",[...D.brief,(D.approvals||[]).length?"승인 대기: "+D.approvals.join(", "):""],D.bots.filter(b=>b.dept==="core"))}
function closeOv(){$("ov").classList.remove("on")}$("ov").onclick=e=>{if(e.target.id==="ov")closeOv()};
$("conn").onclick=()=>{const C=D.connections.categories;$("pn").innerHTML=`<h2><span>연결</span><span style="cursor:pointer" onclick="closeOv()">✕</span></h2>`+C.map(c=>`<div class="ln"><b style="color:#00f0ff">${c.key}</b> · ${c.items.map(x=>x[0]+(x[1]>1?" ×"+x[1]:"")).join(" · ")}${c.note?` <span style="color:#ffb020">· ${esc(c.note)}</span>`:""}</div>`).join("");$("ov").classList.add("on")};
async function send(id,t){t=(t||"").trim();if(!t){T("명령을 입력하세요");return false}const name=(D.bots.find(b=>b.id===id)||{}).name;
 if(api){try{const r=await fetch(AU("api/command"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({botId:id,botName:name,prompt:t})});const j=await r.json();if(r.ok){T("대기열 저장 #"+j.id.slice(0,8)+" · 봇 자동 전달 아님");return true}}catch(e){}}
 const x=`[${name}] ${t}`;try{await navigator.clipboard.writeText(x);T("복사됨 · Grok Bot 앱에서 "+name+"에게 붙여넣기")}catch(e){T("복사 실패: "+x)}return true}
$("bar").onsubmit=async e=>{e.preventDefault();if(await send($("sel").value,$("txt").value))$("txt").value=""};
$("refresh").onclick=async()=>{const pw=sessionStorage.getItem("jv_pw")||localStorage.getItem("jv_pw");if(pw)await unlock(pw,!!localStorage.getItem("jv_pw"));T("갱신됨")};
$("speak").onclick=()=>{if(!D)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("혁진님, 브리핑입니다. "+D.brief.join(" "));u.lang="ko-KR";speechSynthesis.speak(u)}catch(e){T("음성 출력 미지원")}};
addEventListener("resize",draw);
(async()=>{try{api=(await fetch(AU("api/health"))).ok}catch(e){api=false}const pw=localStorage.getItem("jv_pw")||sessionStorage.getItem("jv_pw");if(pw)unlock(pw,!!localStorage.getItem("jv_pw"))})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
$("pushOn").onclick=async()=>{try{if(!("PushManager" in window)){T("푸시 미지원 · iPhone은 홈 화면 앱에서");return}
 if(await Notification.requestPermission()!=="granted"){T("알림 권한 거부");return}
 const k=await (await fetch(AU("api/vapid"))).json(),reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publicKey)});
 T((await fetch(AU("api/subscribe"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)})).ok?"알림 구독 완료":"구독 실패")}catch(e){T("알림 서버 미연결")}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const ALIAS=[["집사","c8f69e15"],["총괄","927a7b6f"],["감시자","173243fe"],["대장","c134c704"],["실험","ec952ea5"],["영어","c16480ab"],["아르바이트","92919409"],["알바","92919409"],["이벤트","61c15c0d"],["알림","61c15c0d"],["event","61c15c0d"],["금융","c8f69e15"],["매매","c134c704"]];
function route(t){const s=t.trim(),l=s.toLowerCase();for(const [k,id] of ALIAS){if(l.startsWith(k)){const b=D&&D.bots.find(x=>x.id.startsWith(id));if(b){$("sel").value=b.id;return {b,rest:s.slice(k.length).replace(/^(봇|bot)?\s*[,，.:]?\s*/i,"")}}}}return {b:null,rest:s}}
$("mic").onclick=()=>{if(!SR){T("이 브라우저는 음성 인식 미지원 · Chrome 또는 최신 Safari 사용");return}if(rec){rec.stop();return}
 rec=new SR();rec.lang="ko-KR";rec.interimResults=true;$("mic").classList.add("on");T("듣는 중…");
 rec.onresult=e=>{let f="",im="";for(const r of e.results)(r.isFinal?f+=r[0].transcript:im+=r[0].transcript);const {b,rest}=route(f||im);$("txt").value=rest;T((b?"▸ "+b.name+" · ":"")+(f||im)+(f?"":" …"));
  if(f){try{const u=new SpeechSynthesisUtterance((b?b.name+"에게 ":"")+"명령 준비됨. 전송을 누르세요");u.lang="ko-KR";speechSynthesis.speak(u)}catch(_){}}};
 rec.onerror=e=>T(e.error==="not-allowed"?"마이크 권한 거부됨":"음성 인식 오류: "+e.error);rec.onend=()=>{$("mic").classList.remove("on");rec=null}};
$("txt").addEventListener("change",()=>{const {b,rest}=route($("txt").value);if(b)$("txt").value=rest});
</script></body></html>
