<title>혁진님의 JARVIS</title><style>

.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(34,227,245,.07);cursor:pointer}.row:first-child{border-top:0}.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m span{display:block;font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:13.5px;font-weight:600;white-space:nowrap;text-align:right}.row .a small{display:block;font-size:10px;color:var(--mut);font-weight:400}.row:after{content:"›";color:var(--mut);font-size:16px}.row.nl:after{content:""}

.k{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 11px;cursor:pointer}.k .l{font-size:10.5px;color:var(--mut)}.k .v{font-size:19px;font-weight:600;margin-top:2px}.k .s{font-size:10.5px;color:var(--sub);margin-top:1px}
.bar{display:grid;grid-template-columns:86px 1fr 62px;gap:8px;align-items:center;font-size:12px;padding:6px 0;cursor:pointer}.bar .tk{height:8px;border-radius:4px;background:rgba(34,227,245,.08);overflow:hidden}.bar .tk i{display:block;height:100%;background:var(--c);border-radius:4px}.bar span:last-child{text-align:right}

.note{font-size:11px;color:var(--mut);line-height:1.5;margin:6px 2px}.miss{color:var(--mut);font-style:normal}
.cols{display:grid;gap:0 14px}@media(min-width:820px){.cols{grid-template-columns:1fr 1fr}}
.stg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.stg em{font-style:normal;font-size:10px;padding:2px 7px;border-radius:8px;border:1px solid var(--line);color:var(--mut)}.stg em.on{border-color:var(--work);color:var(--work)}.stg em.done{color:var(--ok)}

.btn{border:1px solid rgba(34,227,245,.45);background:transparent;color:var(--c);border-radius:10px;padding:8px 12px;font-size:12.5px;margin:6px 6px 0 0}

#tabs button{background:none;border:0;color:var(--mut);font-size:10.5px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}#tabs button b{font-size:17px;font-weight:400;line-height:1}#tabs button.on{color:var(--c)}
#tabs button .nb{position:absolute;top:3px;left:55%;background:var(--c);color:#000;font-size:8.5px;font-weight:800;border-radius:7px;padding:0 4px}
#cmd{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:29;display:flex;gap:6px;padding:7px 10px;background:rgba(0,0,0,.94);border-top:1px solid var(--line);max-width:1180px;margin:0 auto}
#cmd select,#cmd input{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px;padding:0 8px}#cmd select{max-width:31%}#cmd input{flex:1;min-width:0}
#cmd button{height:34px;min-width:36px;border-radius:10px;border:1px solid rgba(34,227,245,.45);background:var(--card);color:var(--c)}#mic.on{background:var(--err);color:#fff;border-color:var(--err)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));z-index:40;background:#0c2a31;color:#fff;font-size:12px;padding:0 12px;border-radius:10px;max-width:90%;text-align:center}#toast:not(:empty){padding:8px 12px}
#lock{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}#lock .rg{font-size:20px;letter-spacing:8px;color:var(--c)}
#lock input[type=password]{width:240px;height:44px;border-radius:12px;border:1px solid rgba(34,227,245,.4);background:var(--card);color:#fff;font-size:16px;text-align:center}#lock label{font-size:12px;color:var(--sub)}#lock button{height:40px;width:240px;border-radius:12px;border:0;background:var(--c);color:#000;font-weight:700}.er{font-size:12px;color:var(--warn);min-height:16px}
.view{display:none}.view.on{display:block}
</style></head><body>
<header><div class="wrap"><div class="hd"><button class="back" id="back">← 뒤로</button><h1 id="ttl">혁진님의 <b>JARVIS</b></h1><button class="ib" id="speak" title="브리핑 듣기">▶</button><button class="ib" id="refresh" title="새로고침">⟳</button><button class="ib" id="pushOn" title="알림 허용">◉</button><button class="ib" id="lockBtn" title="잠금">⏻</button></div>
<div class="sbox"><input id="q" placeholder="무엇이든 검색 — 거래·메일·일정·봇·파일" autocomplete="off" enterkeyhint="search"><button class="x" id="qx">✕</button></div><div class="fresh" id="fresh">—</div></div></header>
<main class="wrap"><div class="view" id="v"></div></main>
<div id="toast"></div>

<div id="lock"><div class="rg">J.A.R.V.I.S</div><form id="lf" style="display:flex;flex-direction:column;align-items:center;gap:12px"><input id="pw" type="password" placeholder="접근 코드" autocomplete="current-password"><label><input type="checkbox" id="rem"> 이 기기 기억</label><button>접속</button><div class="er" id="er"></div></form></div>
<script>
const B=location.hostname==="localhost"?"":(window.API_BASE||"").replace(/\/$/,"");const AU=p=>(B?B+"/":"")+p;let api=false,D=null,LV=0,SEEN={},FX={tx:"전체"};
const $=id=>document.getElementById(id),esc=s=>String(s??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=m=>{$("toast").textContent=m;clearTimeout(T.t);T.t=setTimeout(()=>$("toast").textContent="",5000)};
const SC={idle:"var(--ok)",working:"var(--work)",error:"var(--err)",unknown:"var(--mut)",ok:"var(--ok)",warn:"var(--warn)",work:"var(--work)",info:"var(--c)",muted:"var(--mut)",err:"var(--err)"},LB={idle:"정상",working:"작업 중",error:"오류",unknown:"—"};
const money=(v,d=0)=>v==null?"—":(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=v=>v==null?"—":(v>0?"+":"")+money(v);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const P=await (await fetch("payload.enc.json?t="+Date.now(),{cache:"no-store"})).json();
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.ct))))}
async function unlock(pw,rem){try{D=await decrypt(pw);if(rem)localStorage.setItem("jv_pw",pw);sessionStorage.setItem("jv_pw",pw);$("lock").style.display="none";
 LV=+localStorage.getItem("jv_lastVisit")||0;try{SEEN=JSON.parse(localStorage.getItem("jv_seen")||"{}")}catch(e){SEEN={}}
 $("sel").innerHTML=D.bots.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");render();
 setTimeout(()=>localStorage.setItem("jv_lastVisit",Date.now()),4000);return true}catch(e){$("er").textContent=e.name==="OperationError"?"접근 코드가 올바르지 않습니다":"데이터를 불러오지 못했습니다";return false}}
$("lf").onsubmit=e=>{e.preventDefault();$("er").textContent="해독 중…";unlock($("pw").value.trim(),$("rem").checked)};
$("lockBtn").onclick=()=>{localStorage.removeItem("jv_pw");sessionStorage.removeItem("jv_pw");D=null;$("v").innerHTML="";$("lock").style.display="flex"};
// ---------- helpers ----------
const pd=s=>{if(!s)return null;const d=new Date(s.length===10?s+"T12:00:00-05:00":s);return isNaN(d)?null:d};
const md=s=>{const d=pd(s);return d?(d.getMonth()+1)+"/"+d.getDate():"—"};
const hm=s=>{const d=pd(s);if(!d)return"—";return (s.length===10?md(s):md(s)+" "+d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"America/Chicago"}))};
function rel(s){const d=pd(s);if(!d)return"—";const m=(Date.now()-d)/6e4;if(m<1)return"방금";if(m<60)return Math.round(m)+"분 전";if(m<1440)return Math.round(m/60)+"시간 전";return Math.round(m/1440)+"일 전"}
const isNew=x=>!SEEN[x.id]&&(LV?(Date.parse(x.firstSeen)>LV-1000):Date.parse(x.ts)>Date.now()-864e5);
const newOf=f=>D.feed.filter(x=>f(x)&&isNew(x)).length;const nwId=(kind,id)=>{const x=D.feed.find(y=>y.kind===kind&&y.ref===id);return x&&isNew(x)?'<span class="nw">NEW</span>':""};
function markSeen(kind,id){D.feed.filter(y=>y.kind===kind&&y.ref===id).forEach(y=>SEEN[y.id]=1);localStorage.setItem("jv_seen",JSON.stringify(SEEN))}
function spark(vals,color="var(--c)",H=28,bars){if(!vals||vals.length<2)return"";const W=160,mx=Math.max(...vals,1),mn=bars?0:Math.min(...vals,0);
 if(bars){const bw=W/vals.length;return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${vals.map((v,i)=>{const h=Math.max(1,(v/mx)*H);return `<rect x="${i*bw+.5}" y="${H-h}" width="${Math.max(1,bw-1.5)}" height="${h}" rx="1" fill="${color}" opacity="${i>=vals.length-7?1:.4}"/>`}).join("")}</svg>`}
 const p=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-2-((v-mn)/((mx-mn)||1))*(H-4)).toFixed(1)}`).join(" ");return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`}
function meter(pct,color){return `<svg viewBox="0 0 160 8" width="100%" height="8" preserveAspectRatio="none"><rect width="160" height="8" rx="4" fill="rgba(34,227,245,.1)"/><rect width="${1.6*Math.min(100,pct||0)}" height="8" rx="4" fill="${color}"/></svg>`}
const row=(go,title,sub,amt,amtSub,nw="")=>`<div class="row${go?"":" nl"}" ${go?`onclick="go('${go}')"`:""}><div class="m"><b>${nw}${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>${amt!=null?`<div class="a">${amt}${amtSub?`<small>${esc(amtSub)}</small>`:""}</div>`:""}</div>`;
const kpi=(go,l,v,s,cls="")=>`<div class="k" ${go?`onclick="go('${go}')"`:""}><div class="l">${esc(l)}</div><div class="v ${cls}">${v}</div>${s?`<div class="s">${esc(s)}</div>`:""}</div>`;
const card=h=>`<div class="card">${h}</div>`;const H2=(t,s)=>`<h2>${esc(t)}${s?`<small>${esc(s)}</small>`:""}</h2>`;
const botBy=id=>D.bots.find(b=>b.id===id);const DEPT={"매매":["173243fe","c134c704","ec952ea5"]};
const txRow=t=>row("tx:"+t.id,t.name,`${md(t.date)} · ${t.cat}${t.pending?" · 대기":""} · ${t.src==="card"?"카드":"계좌"}`,`<span class="${t.amount>0?"t-ok":""}">${t.amount>0?"+":""}${money(t.amount,2)}</span>`,null,nwId("tx",t.id));
const mailRow=m=>row("mail:"+m.id,m.subject,`${m.from} · ${m.type} · ${hm(m.date)}`,null,null,nwId("mail",m.id)+(m.unread?"● ":""));
const botRow=b=>{const st=b.stages||[],ci=st.indexOf(b.stage);return `<div class="row" onclick="go('bot:${b.id}')"><i style="width:9px;height:9px;border-radius:50%;background:${SC[b.status]};flex:none"></i><div class="m"><b>${esc(b.name)} <small style="color:${SC[b.status]};font-size:10.5px">${LB[b.status]||"—"}</small></b><span>${b.summaryLive?esc(b.summary):"요약 없음"}</span>${st.length?`<div class="stg">${st.map((x,j)=>`<em class="${j===ci?"on":ci>=0&&j<ci?"done":""}">${esc(x)}</em>`).join("")}</div>`:b.stage?`<div class="stg"><em class="on">${esc(b.stage)}</em></div>`:""}</div><div class="a"><small>${b.updatedAt?rel(b.updatedAt):"—"}</small></div></div>`};
const GA=()=>D.generatedAt.replace(" ","T").replace(" CT","")+":00-05:00";const F=()=>D.fin||{},M=()=>D.mail||{};
// ---------- tiles ----------
function tiles(){const f=F(),m=M(),wk=(f.weeks||[]).map(w=>w.spend),fr=D.collectedAt,bots=D.bots,trade=bots.filter(b=>DEPT["매매"].some(p=>b.id.startsWith(p)));
 const ev0=(D.events||[])[0],eng=bots.find(b=>b.id.startsWith("c16480ab")),side=D.side||{};const flag=(m.flagged||[]).length;
 const recM=(f.recurring||[]).filter(r=>r.kind!=="반복(금액 변동)").reduce((s,r)=>s+r.amount,0);
 return [
 {k:"net",t:"순현금",v:money(f.net),cx:`현금 ${money(f.cash)} − 카드 ${money(f.cardBalance)}`,sp:meter(f.cash?100*f.net/f.cash:0,"var(--ok)"),tone:"ok",nk:x=>x.kind==="tx",fr:f.syncedAt},
 {k:"spend",t:"30일 지출",v:money(f.spend30),cx:`이번 주 ${money(wk[wk.length-1])} · 지난주 대비 ${D.weekTrend==null?"—":(D.weekTrend>0?"▲":"▼")+Math.abs(D.weekTrend)+"%"}`,sp:spark((f.daily||[]).map(d=>d.spend),"var(--c)",28,1),tone:D.weekTrend>15?"warn":"ok",nk:x=>x.kind==="tx"&&x.tone==="out",fr:f.syncedAt},
 {k:"flow",t:"30일 현금흐름",v:sg(f.cash30),cx:`입금 ${money(f.income30)} · ${f.range30||""}`,sp:meter(f.income30?100*f.spend30/f.income30:0,"var(--c)"),tone:f.cash30>=0?"ok":"warn",nk:x=>x.kind==="tx"&&x.tone==="in",fr:f.syncedAt},
 {k:"card",t:"카드 사용률",v:(f.cardUtil??"—")+"<small>%</small>",cx:`잔액 ${money(f.cardBalance)} · 가능 ${money(f.cardAvailable)}`,sp:meter(f.cardUtil,f.cardUtil>50?"var(--warn)":"var(--ok)"),tone:f.cardUtil>50?"warn":"ok",fr:f.syncedAt},
 {k:"bills",t:"다가오는 청구",v:(f.bills||[]).length+"<small>건 · 21일</small>",cx:(f.bills||[]).map(b=>`${b.name} ${md(b.next)}`).join(" · ")||"예정 없음",tone:(f.bills||[]).length?"warn":"ok",fr:f.syncedAt},
 {k:"recur",t:"정기결제·고정비",v:money(recM)+"<small>/월 추정</small>",cx:`${(f.recurring||[]).length}개 · 거래 패턴 추정`,tone:"info",fr:f.syncedAt},
