<script>
const B=location.hostname==="localhost"?"":(window.API_BASE||"").replace(/\/$/,"");const AU=p=>(B?B+"/":"")+p;let api=false,D=null,LV=0,SEEN={},FX={tx:"전체"};
const $=id=>document.getElementById(id),esc=s=>String(s??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=m=>{$("toast").textContent=m;clearTimeout(T.t);T.t=setTimeout(()=>$("toast").textContent="",5000)};
const SC={idle:"var(--ok)",working:"var(--work)",error:"var(--err)",unknown:"var(--mut)",ok:"var(--ok)",warn:"var(--warn)",work:"var(--work)",info:"var(--c)",muted:"var(--mut)",err:"var(--err)"},LB={idle:"정상",working:"작업 중",error:"오류",unknown:"—"};
const money=(v,d=0)=>v==null?"—":(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=v=>v==null?"—":(v>0?"+":"")+money(v);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const P=await (await fetch("payload.enc.json?t="+Date.now(),{cache:"no-store"})).json();
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.ct))))}
async function unlock(pw,rem){try{D=await decrypt(pw);if(rem)localStorage.setItem("jv_pw",pw);sessionStorage.setItem("jv_pw",pw);$("lock").style.display="none";setTimeout(liveFetch,300);clearInterval(window._lv);window._lv=setInterval(liveFetch,60000);
 LV=+localStorage.getItem("jv_lastVisit")||0;try{SEEN=JSON.parse(localStorage.getItem("jv_seen")||"{}")}catch(e){SEEN={}}
 $("sel").innerHTML=D.bots.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");render();
 setTimeout(()=>localStorage.setItem("jv_lastVisit",Date.now()),4000);return true}catch(e){$("er").textContent=e.name==="OperationError"?"접근 코드가 올바르지 않습니다":"데이터를 불러오지 못했습니다";return false}}
$("lf").onsubmit=e=>{e.preventDefault();$("er").textContent="해독 중…";unlock($("pw").value.trim(),$("rem").checked)};
$("lockBtn").onclick=()=>{localStorage.removeItem("jv_pw");sessionStorage.removeItem("jv_pw");D=null;$("v").innerHTML="";$("lock").style.display="flex"};
// ---------- helpers ----------
const pd=s=>{if(!s)return null;const d=new Date(s.length===10?s+"T12:00:00-05:00":s);return isNaN(d)?null:d};
const md=s=>{const d=pd(s);return d?(d.getMonth()+1)+"/"+d.getDate():"—"};

TITLE.x="차트";TITLE.mer="가맹점";TITLE.wkd="주간";TITLE.wd="요일";TITLE.news="뉴스";TITLE.itop="관심사 뉴스";TITLE.brief="브리핑";TITLE.wxmap="지도";
function render(){if(!D)return;const p=cur(),q=$("q").value.trim();const [k,...r]=p.split(":");const a=r.join(":");const tab=TABS.find(t=>t[0]===k);
 const home=k==="home"&&!q;$("back").classList.toggle("on",!home);$("ttl").innerHTML=home?'혁진님의 <b>JARVIS</b>':esc(q?"검색":tab?tab[2]:(TITLE[k]||"상세"));
 $("fresh").textContent=`봇 ${rel(GA())} · 금융·메일 ${rel(D.collectedAt)} 수집 (${hm(D.collectedAt)} CT)`;
 const act=tab?k:(["x","mer","wkd","wd","net","acct","spend","flow","card","bills","recur","pending","txall","cat","week","day","rec","tx","wk","heat"].includes(k)?"money":["trade","invest","crypto","coin","stk","paper","fx"].includes(k)?"inv":["interest","topic","itop"].includes(k)?"imap":["rec7","fortune","grok","family"].includes(k)?"reco":["botsall","bot","routines"].includes(k)?"bots":k==="home"?"home":"cats");
 $("tabs").innerHTML=TABS.map(t=>{const n=TABNEW[t[0]]?newOf(TABNEW[t[0]]):0;return `<button class="${t[0]===act&&!q?"on":""}" onclick="$('q').value='';$('qx').style.display='none';go('${t[0]}')"><b>${t[1]}</b>${t[2]}${n?`<span class="nb">${n}</span>`:""}</button>`}).join("");
 let h;try{h=q?search(q):(V[k]?V[k](a):V.home())}catch(e){h=card(row(null,"표시 오류",e.message))}
 const v=$("v");v.className="view on";v.innerHTML=h}
window.addEventListener("hashchange",()=>{$("q").value="";$("qx").style.display="none";render();scrollTo(0,0)});
$("back").onclick=()=>{if($("q").value){$("q").value="";$("qx").style.display="none";render();return}if(history.length>1&&cur()!=="home")history.back();else go("home")};
let qt;$("q").oninput=()=>{$("qx").style.display=$("q").value?"block":"none";clearTimeout(qt);qt=setTimeout(render,120)};$("qx").onclick=()=>{$("q").value="";$("qx").style.display="none";render()};
function pick(id){$("sel").value=id;$("txt").focus()}
async function send(id,t){t=(t||"").trim();if(!t){T("명령을 입력하세요");return false}const name=(botBy(id)||{}).name;
 if(api){try{const r=await fetch(AU("api/command"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({botId:id,botName:name,prompt:t})});const j=await r.json();if(r.ok){T("대기열 저장 #"+j.id.slice(0,8)+" · 봇 자동 전달 아님");return true}}catch(e){}}
 const x=`[${name}] ${t}`;try{await navigator.clipboard.writeText(x);T("복사됨 · Grok Bot 앱에서 "+name+"에게 붙여넣기")}catch(e){T("복사 실패: "+x)}return true}
$("cmd").onsubmit=async e=>{e.preventDefault();if(await send($("sel").value,$("txt").value))$("txt").value=""};
$("refresh").onclick=async()=>{const pw=sessionStorage.getItem("jv_pw")||localStorage.getItem("jv_pw");if(pw)await unlock(pw,!!localStorage.getItem("jv_pw"));T("갱신됨 · 연결 데이터는 'JARVIS 업데이트'로 새로 수집")};
$("speak").onclick=()=>{if(!D)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("혁진님, 오늘의 브리핑입니다. "+D.headline.join(". "));u.lang="ko-KR";speechSynthesis.speak(u)}catch(e){T("음성 출력 미지원")}};
(async()=>{try{api=(await fetch(AU("api/health"))).ok}catch(e){api=false}const pw=localStorage.getItem("jv_pw")||sessionStorage.getItem("jv_pw");if(pw)unlock(pw,!!localStorage.getItem("jv_pw"))})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
$("pushOn").onclick=async()=>{try{if(!("PushManager" in window)){T("푸시 미지원 · iPhone은 홈 화면 앱에서");return}if(await Notification.requestPermission()!=="granted"){T("알림 권한 거부");return}
 const k=await (await fetch(AU("api/vapid"))).json(),reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publicKey)});
 T((await fetch(AU("api/subscribe"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)})).ok?"알림 구독 완료":"구독 실패")}catch(e){T("알림 서버 미연결")}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const ALIAS=[["집사","c8f69e15"],["총괄","927a7b6f"],["감시자","173243fe"],["대장","c134c704"],["실험","ec952ea5"],["영어","c16480ab"],["아르바이트","92919409"],["알바","92919409"],["이벤트","61c15c0d"],["알림","61c15c0d"],["event","61c15c0d"],["금융","c8f69e15"],["매매","c134c704"]];
function route(t){const s=t.trim(),l=s.toLowerCase();for(const [k,id] of ALIAS){if(l.startsWith(k)){const b=D&&D.bots.find(x=>x.id.startsWith(id));if(b){$("sel").value=b.id;return {b,rest:s.slice(k.length).replace(/^(봇|bot)?\s*[,，.:]?\s*/i,"")}}}}return {b:null,rest:s}}
$("mic").onclick=()=>{if(!SR){T("이 브라우저는 음성 인식 미지원 · Chrome 또는 최신 Safari 사용");return}if(rec){rec.stop();return}
 rec=new SR();rec.lang="ko-KR";rec.interimResults=true;$("mic").classList.add("on");T("듣는 중…");
 rec.onresult=e=>{let f="",im="";for(const r of e.results)(r.isFinal?f+=r[0].transcript:im+=r[0].transcript);const {b,rest}=route(f||im);$("txt").value=rest;T((b?"▸ "+b.name+" · ":"")+(f||im)+(f?"":" …"));
  if(f){try{const u=new SpeechSynthesisUtterance((b?b.name+"에게 ":"")+"명령 준비됨. 전송을 누르세요");u.lang="ko-KR";speechSynthesis.speak(u)}catch(_){}}};
 rec.onerror=e=>T(e.error==="not-allowed"?"마이크 권한 거부됨":"음성 인식 오류: "+e.error);rec.onend=()=>{$("mic").classList.remove("on");rec=null}};
$("txt").addEventListener("change",()=>{const {b,rest}=route($("txt").value);if(b)$("txt").value=rest});
